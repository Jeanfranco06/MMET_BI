# =============================================================================
# MMET_BI — Orquestación Docker Compose (Desarrollo local y Alibaba Cloud ECS)
# =============================================================================
# Uso estándar (conectando a SQL Server externo o Alibaba Cloud RDS SQL Server):
#   docker compose up -d --build
#
# Uso con contenedor local opcional de SQL Server 2022:
#   docker compose --profile local-sqlserver up -d --build
# =============================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mmet_bi_sqlserver
    profiles: ["local-sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-CambiarPorPasswordSeguro123!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mmet_sqlserver_data:/var/opt/mssql
      - ./sql_server:/scripts:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmet_bi_backend
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Conexión SQL Server (Alibaba Cloud RDS / ECS o servicio local `sqlserver`)
      DB_AUTH_MODE: ${DB_AUTH_MODE:-sql}
      DB_SERVER: ${DB_SERVER:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_DATABASE: ${DB_DATABASE:-MMET_BI_OLTP}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-CambiarPorPasswordSeguro123!}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_SERVER_CERT: ${DB_TRUST_SERVER_CERT:-true}
      # Bootstrap ADMIN
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin-local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-CambiarPorClaveDeAlMenos14Caracteres!}
      # IA Generativa (RQ-BI-15) — Alibaba Cloud Model Studio / OpenAI-compatible
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mmet_bi_frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mmet_sqlserver_data:
