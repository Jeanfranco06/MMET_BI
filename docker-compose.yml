# Two independent PostgreSQL 17 databases, with separate volumes and connections.
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    NODE_ENV: production
    COOKIE_SECURE: "false" # Local HTTP demo; use true behind HTTPS.
    PORT: 4000
    CORS_ORIGIN: http://localhost:3000
    OLTP_PG_HOST: postgres-oltp
    OLTP_PG_PORT: 5432
    OLTP_PG_DATABASE: mmet_bi_oltp
    OLTP_PG_USER: postgres
    OLTP_PG_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    OLTP_PG_SSL: "false"
    DM_PG_HOST: postgres-dm
    DM_PG_PORT: 5432
    DM_PG_DATABASE: mmet_bi_dm
    DM_PG_USER: postgres
    DM_PG_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    DM_PG_SSL: "false"
    BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin-local}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina BOOTSTRAP_ADMIN_PASSWORD en .env}
    AI_BASE_URL: ${AI_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-qwen-plus}
  depends_on:
    postgres-oltp:
      condition: service_healthy
    postgres-dm:
      condition: service_healthy
services:
  postgres-oltp:
    image: postgres:17
    environment:
      POSTGRES_DB: mmet_bi_oltp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["mmet_oltp_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmet_bi_oltp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  postgres-dm:
    image: postgres:17
    environment:
      POSTGRES_DB: mmet_bi_dm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["mmet_dm_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmet_bi_dm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db-init:
    <<: *backend
    command: ["sh", "-c", "npm run db:init && npm run db:seed && node scripts/db.cjs etl 2026-11-23"]
    restart: "no"
  backend:
    <<: *backend
    ports: ["4000:4000"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  mmet_oltp_data:
  mmet_dm_data:
